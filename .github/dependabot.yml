version: 2
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: Asia/Shanghai
    # 仅当多个包之间存在 peer/直接依赖关系、单独升级可能出错时才放在同一个分组。
    # 其余依赖保持 Dependabot 默认行为（每个依赖单独一个 PR）。
    groups:
      typeorm:
        patterns:
          - "@nestjs/typeorm"
          - typeorm
          - better-sqlite3
          - "@types/better-sqlite3"
          - pg
          - "@types/pg"
          - mysql2
      cache:
        patterns:
          - "@nestjs/cache-manager"
          - cache-manager
          - keyv
          - "@keyv/*"
          - ioredis
      session:
        patterns:
          - express-session
          - connect-redis
      rate-limit:
        patterns:
          - express-rate-limit
          - rate-limit-redis
      passport:
        patterns:
          - "@nestjs/passport"
          - passport
          - passport-local
          - passport-strategy
          - "@types/passport-local"
          - "@types/passport-strategy"
      nestjs-cli:
        patterns:
          - "@nestjs/cli"
          - "@nestjs/schematics"
      nestjs:
        patterns:
          - "@nestjs/common"
          - "@nestjs/core"
          - "@nestjs/platform-express"
          - "@nestjs/testing"
          - "@nestjs/config"
          - "@nestjs/schedule"
          - "@nestjs/serve-static"
          - "@nestjs/swagger"
          - reflect-metadata
          - rxjs
      test:
        patterns:
          - jest
          - ts-jest
          - jest-openapi
          - "@types/jest"
      lint:
        patterns:
          - eslint
          - eslint-config-cmyr
          - commitlint
          - commitlint-config-cmyr
          - commitizen
          - cz-conventional-changelog-cmyr
      release:
        patterns:
          - semantic-release
          - semantic-release-cmyr-config
          - "@semantic-release/exec"
      sentry:
        patterns:
          - "@sentry/nestjs"
          - "@sentry/profiling-node"
      winston:
        patterns:
          - winston
          - nest-winston
          - winston-daily-rotate-file
      typescript:
        patterns:
          - typescript
          - ts-node
      content:
        patterns:
          - "@cao-mei-you-ren/rss-parser"
          - "@cao-mei-you-ren/postlight_parser"
          - feedsmith
          - entities
          - fast-xml-parser
    ignore:
      - dependency-name: "file-type"
        versions:
          - ">= 17.0.0"
      - dependency-name: "query-string"
        versions:
          - ">= 8.0.0"
      - dependency-name: "p-limit"
        versions:
          - ">= 4.0.0"
      - dependency-name: "p-queue"
        versions:
          - ">= 6.0.0"
      - dependency-name: "parse-torrent"
        versions:
          - ">= 10.0.0"
      - dependency-name: "@nestjs/swagger"
        versions:
          - ">= 8.0.0" # 8.0.0 以上的版本会导致 nestjs 无法启动
      - dependency-name: "@sentry/profiling-node"
        versions:
          - ">= 8.48.0" # 8.48.0 以上的版本包含 .node 文件，会导致 docker 无法启动
      - dependency-name: art-template
        versions:
          - ">=4.13.3" # 4.13.3 以上版本存在恶意代码，参考 https://github.com/yoimiya-kokomi/Miao-Yunzai/pull/515
      - dependency-name: bcrypt
        versions:
          - ">= 6.0.0" # 6.0.0 以上版本会导致 docker 无法启动
      - dependency-name: "connect-redis"
        versions:
          - ">= 9.0.0" # 9.0.0 以上版本会导致 redis 无法连接
      - dependency-name: "typescript"
        versions:
          - ">= 7.0.0" # 7.0 为原生编译器重写版本，需单独评估迁移
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 20
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
